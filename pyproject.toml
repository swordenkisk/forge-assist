[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-assist"
version = "0.1.0"
description = "A cautious AI coding assistant for creating and updating project files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forge-assist = "forge_assist.__main__:main"

[tool.setuptools.packages.find]
include = ["forge_assist*"]
